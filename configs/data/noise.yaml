# Controlled Gaussian-Poisson noise configuration, frozen in Stage 02.
# Calibration: scripts/calibrateNoise.py on 20 validation images (10 per dataset),
# targets 32/26/20 dB in sRGB. Report: results/classical_denoising/noise_calibration.json.

color_space: sRGB
range: [0.0, 1.0]
apply_in: linear_light
seed_policy: fixed_per_image_and_level
formula: "y = clip(alpha * Poisson(x / alpha) + N(0, sigma^2), 0, 1)"

levels:
  clean:
    enabled: true
    alpha: 0.0
    sigma: 0.0
  low:
    enabled: true
    alpha: 0.001
    sigma: 0.002
    measured_psnr_db: 32.397
  medium:
    enabled: true
    alpha: 0.01
    sigma: 0.005
    measured_psnr_db: 25.573
  high:
    enabled: true
    alpha: 0.05
    sigma: 0.02
    measured_psnr_db: 20.105

notes:
  - "Values are calibrated so levels are distinguishable for 8-bit images."
  - "The same noise realization is used by every method for a given image and level."
  - "Frozen before the single test evaluation; do not retune after seeing test results."
  - "Expected mean PSNR in sRGB: low ~32.4 dB, medium ~25.6 dB, high ~20.1 dB."
