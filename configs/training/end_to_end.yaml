# Stage 06 end-to-end U-Net training.
# input_mode: real uses L -> G; controlled uses L + n -> G.
frozen: true

run_name: end_to_end
model_config: configs/models/unet_brightening.yaml

data:
  train_splits:
    - data/splits/lol_train.csv
    - data/splits/lolv2_train.csv
  val_splits:
    - data/splits/lol_val.csv
    - data/splits/lolv2_val.csv
  val_max_images_per_dataset: 0
  input_mode: real
  noise_config: configs/data/noise.yaml
  controlled_levels: [low, medium, high]
  val_levels: [low, medium, high]

loss:
  name: l1_perceptual
  lambda_lpips: 0.05

training:
  epochs: 30
  batch_size: 4
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001
  warmup_epochs: 2
  scheduler: cosine
  eta_min_factor: 0.01
  grad_clip: 1.0
  grad_accum_steps: 1
  amp: true
  patience: 8
  min_delta: 0.0001
  monitor: val_psnr
  seeds: [0, 1, 2]
