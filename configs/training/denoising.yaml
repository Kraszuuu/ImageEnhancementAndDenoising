# Stage 03 CNN denoising configuration.
# Loss name is frozen after the seeded validation pilot; test is never used for selection.

run_name: denoising_unet
frozen: true

data:
  train_splits:
    - data/splits/lol_train.csv
    - data/splits/lolv2_train.csv
  val_splits:
    - data/splits/lol_val.csv
    - data/splits/lolv2_val.csv
  noise_config: configs/data/noise.yaml
  train_levels: [clean, low, medium, high]
  val_levels: [clean, low, medium, high]
  val_max_images_per_dataset: 24

model_config: configs/models/unet_denoising.yaml

loss:
  name: l1_perceptual
  lambda_lpips: 0.05

training:
  epochs: 30
  batch_size: 4
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 2
  scheduler: cosine
  eta_min_factor: 0.01
  grad_clip: 1.0
  grad_accum_steps: 1
  amp: true
  patience: 8
  min_delta: 0.0001
  monitor: val_psnr
  seeds: [0, 1, 2]
