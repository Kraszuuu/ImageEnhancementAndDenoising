# Stage 06 pipeline-aware CNN brightener training.
# One model per denoiser source: D_fixed (classical) or D_cnn (cnn).
frozen: true

run_name: pipeline_brightening
model_config: configs/models/unet_brightening.yaml

data:
  train_splits:
    - data/splits/lol_train.csv
    - data/splits/lolv2_train.csv
  val_splits:
    - data/splits/lol_val.csv
    - data/splits/lolv2_val.csv
  val_max_images_per_dataset: 0
  d_fixed_config: configs/pipelines/d_fixed.yaml
  d_fixed_cache: outputs/d_fixed_cache
  cnn_cache_root: outputs/pipeline_source_cache/cnn
  cnn_checkpoint_root: checkpoints/denoising_cnn

loss:
  name: l1_perceptual
  lambda_lpips: 0.05

training:
  epochs: 30
  batch_size: 4
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001
  warmup_epochs: 2
  scheduler: cosine
  eta_min_factor: 0.01
  grad_clip: 1.0
  grad_accum_steps: 1
  amp: true
  patience: 8
  min_delta: 0.0001
  monitor: val_psnr
  seeds: [0, 1, 2]
