# Stage 06 2x2 pipeline: CNN denoiser -> classical brightener.
frozen: true
name: cnn_classical
order: denoise_then_brighten

denoiser:
  kind: cnn
  checkpoint_root: checkpoints/denoising_cnn
  model_config: configs/models/unet_denoising.yaml

brightener:
  kind: classical
  config: configs/classical/brightening_frozen.yaml
  track: raw
  method: gamma
