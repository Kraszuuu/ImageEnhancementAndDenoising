[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowlight"
version = "0.1.0"
description = "Low-light image enhancement and denoising: classical and CNN baselines."
readme = "README.md"
requires-python = "==3.14.*"
license = { text = "Proprietary" }
authors = [{ name = "ImageEnhancementAndDenoising authors" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "Pillow",
    "matplotlib",
    "pandas",
    "tqdm",
    "PyYAML",
    "huggingface_hub",
    "lpips",
    "bm3d",
    "bm4d",
    "pyiqa",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
demo = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["lowlight"]
strict = false
warn_unused_ignores = true

[tool.mypy-lowlight]
ignore_missing_imports = true
